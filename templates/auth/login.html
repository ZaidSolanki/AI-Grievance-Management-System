{% extends "base.html" %} {% block title %}Login{% endblock %} {% block content
%}
<h1>Welcome back</h1>
<p class="muted">Use this form to test the login API endpoint.</p>

<form id="login-form">
  <label for="email">Email</label>
  <input
    id="email"
    name="email"
    type="email"
    placeholder="you@example.com"
    required
  />

  <label for="password">Password</label>
  <input
    id="password"
    name="password"
    type="password"
    placeholder="Enter password"
    required
  />

  <label for="role">Role</label>
  <select id="role" name="role">
    <option value="user">User</option>
    <option value="admin">Admin</option>
  </select>

  <button type="submit">Log in</button>
</form>

<div id="login-message" class="message"></div>

<div class="link-row">
  <span>Need an account?</span>
  <a href="/auth/signup">Create one</a>
</div>

<script>
  const form = document.getElementById("login-form");
  const messageBox = document.getElementById("login-message");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const formData = new FormData(form);

    try {
      const response = await fetch("/auth/login", {
        method: "POST",
        body: formData,
      });

      const data = await response.json();
      messageBox.className = "message " + (response.ok ? "success" : "error");
      messageBox.textContent = data.message || "Login completed.";

      if (response.ok && data.redirect_url) {
        window.location.href = data.redirect_url;
      }
    } catch (error) {
      messageBox.className = "message error";
      messageBox.textContent = "Unable to reach the login endpoint.";
    }
  });
</script>
{% endblock %}
