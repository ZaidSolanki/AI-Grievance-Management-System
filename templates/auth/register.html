<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – AI Grievance Portal</title>
    <link rel="stylesheet" href="../../static/css/auth.css">
</head>

<body class="auth-page">
    <section class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-left">
                <div class="brand">
                    <div class="logo">AG</div>
                    <div>
                        <h1>Create your account</h1>
                        <div class="text-small text-muted">Register as a citizen to lodge grievances and track updates
                            easily.</div>
                    </div>
                </div>

                <form class="auth-form" id="register-form" action="/auth/signup" method="post" novalidate>
                    <div class="form-field">
                        <div class="input-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="1.6">
                                <path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5z"></path>
                                <path d="M17 14c-2.33 1.67-6 1.67-8.33 0"></path>
                            </svg></div>
                        <input id="full-name" type="text" name="username" placeholder=" " required autocomplete="name" minlength="2" maxlength="60" pattern="[A-Za-z\u0900-\u097F\s.'-]{2,60}">
                        <label for="full-name">Full Name</label>
                        <span class="field-error" id="register-name-error" aria-live="polite"></span>
                    </div>

                    <div class="form-field">
                        <div class="input-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="1.6">
                                <path d="M3 8l9 6 9-6"></path>
                                <path d="M21 8v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8"></path>
                            </svg></div>
                        <input id="email" type="email" name="email" placeholder=" " required autocomplete="email" minlength="5" maxlength="120">
                        <label for="email">Email Address</label>
                        <span class="field-error" id="register-email-error" aria-live="polite"></span>
                    </div>

                    <div class="form-field">
                        <div class="input-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="1.6">
                                <path
                                    d="M17 20H7a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h3l2 2h5a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2z" />
                            </svg></div>
                        <input id="phone" type="tel" name="phone" placeholder=" " required autocomplete="tel" minlength="10" maxlength="15" pattern="[0-9+\-\s()]{10,15}">
                        <label for="phone">Phone Number</label>
                        <span class="field-error" id="register-phone-error" aria-live="polite"></span>
                    </div>

                    <div class="form-field">
                        <div class="input-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="1.6">
                                <path d="M3 12h18" />
                                <path d="M3 6h18" />
                            </svg></div>
                        <input id="address" type="text" name="address" placeholder=" " required minlength="5" maxlength="120">
                        <label for="address">Residential Address</label>
                        <span class="field-error" id="register-address-error" aria-live="polite"></span>
                    </div>

                    <div class="form-field">
                        <div class="input-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="1.6">
                                <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg></div>
                        <input id="password" type="password" name="password" placeholder=" " required autocomplete="new-password" minlength="6" maxlength="128">
                        <label for="password">Password</label>
                        <span class="field-error" id="register-password-error" aria-live="polite"></span>
                    </div>

                    <div class="form-field">
                        <div class="input-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="1.6">
                                <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg></div>
                        <input id="confirm-password" type="password" name="confirm_password" placeholder=" " required autocomplete="new-password" minlength="6" maxlength="128">
                        <label for="confirm-password">Confirm Password</label>
                        <span class="field-error" id="register-confirm-error" aria-live="polite"></span>
                    </div>

                    <div class="form-error" id="register-form-error" role="alert" aria-live="assertive" hidden></div>

                    <button type="submit" class="btn btn-primary">Create Account</button>
                </form>

                <div class="auth-footer">
                    Already registered? <a href="login.html">Sign in here</a>
                </div>
            </div>

            <div class="auth-right">
                <div class="visual" aria-hidden="true">
                    <svg width="140" height="120" viewBox="0 0 24 24" fill="none" stroke="url(#rg)" stroke-width="1.6"
                        xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0" stop-color="#1e3a8a" />
                                <stop offset="1" stop-color="#0d9488" />
                            </linearGradient>
                        </defs>
                        <path d="M12 3v5" stroke-linecap="round"></path>
                        <circle cx="12" cy="11" r="4"></circle>
                        <path d="M8 18h8" stroke-linecap="round"></path>
                    </svg>
                </div>
                <div class="right-text">
                    <h3>Join the Civic Network</h3>
                    <p class="text-muted">Create an account to submit voice or typed grievances and get real-time
                        updates.</p>
                </div>
            </div>
        </div>
    </section>

    <script src="../../static/js/main.js"></script>
    <script src="../../static/js/auth.js"></script>
</body>

</html>
