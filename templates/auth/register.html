{% extends "base.html" %} {% block title %}Sign up{% endblock %} {% block
content %}
<h1>Create an account</h1>
<p class="muted">Use this form to test the signup API endpoint.</p>

<form id="signup-form">
  <label for="username">Username</label>
  <input
    id="username"
    name="username"
    type="text"
    placeholder="Choose a username"
    required
  />

  <label for="email">Email</label>
  <input
    id="email"
    name="email"
    type="email"
    placeholder="you@example.com"
    required
  />

  <label for="password">Password</label>
  <input
    id="password"
    name="password"
    type="password"
    placeholder="Create a password"
    required
  />

  <label for="role">Role</label>
  <select id="role" name="role">
    <option value="user">User</option>
    <option value="admin">Admin</option>
  </select>

  <button type="submit">Create account</button>
</form>

<div id="signup-message" class="message"></div>

<div class="link-row">
  <span>Already registered?</span>
  <a href="/auth/login">Log in</a>
</div>

<script>
  const form = document.getElementById("signup-form");
  const messageBox = document.getElementById("signup-message");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const formData = new FormData(form);

    try {
      const response = await fetch("/auth/signup", {
        method: "POST",
        body: formData,
      });

      const data = await response.json();
      messageBox.className = "message " + (response.ok ? "success" : "error");
      messageBox.textContent = data.message || "Signup completed.";
    } catch (error) {
      messageBox.className = "message error";
      messageBox.textContent = "Unable to reach the signup endpoint.";
    }
  });
</script>
{% endblock %}
