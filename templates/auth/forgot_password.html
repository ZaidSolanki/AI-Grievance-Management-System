<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password – AI Grievance Portal</title>
    <link rel="stylesheet" href="../../static/css/auth.css">
</head>

<body class="auth-page">
    <section class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-left">
                <div class="brand">
                    <div class="logo">AG</div>
                    <div>
                        <h1>Forgot your password?</h1>
                        <div class="text-small text-muted">Enter your email address to receive a password reset link.
                        </div>
                    </div>
                </div>

                <form class="auth-form" action="login.html" method="get">
                    <div class="form-field">
                        <div class="input-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="1.6">
                                <path d="M3 8l9 6 9-6"></path>
                                <path d="M21 8v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8"></path>
                            </svg></div>
                        <input id="email" type="email" name="email" placeholder=" " required>
                        <label for="email">Email Address</label>
                    </div>

                    <button type="submit" class="btn btn-primary">Send Reset Link</button>
                </form>

                <div class="auth-footer">
                    Remembered your password? <a href="login.html">Back to Login</a>
                </div>
            </div>

            <div class="auth-right">
                <div class="visual" aria-hidden="true">
                    <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="url(#rg2)" stroke-width="1.6"
                        xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="rg2" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0" stop-color="#1e3a8a" />
                                <stop offset="1" stop-color="#0d9488" />
                            </linearGradient>
                        </defs>
                        <path d="M12 2v6" stroke-linecap="round"></path>
                        <circle cx="12" cy="11" r="4"></circle>
                        <path d="M8 18h8" stroke-linecap="round"></path>
                    </svg>
                </div>
                <div class="right-text">
                    <h3>Reset securely</h3>
                    <p class="text-muted">We’ll send a secure reset link to your registered email address.</p>
                </div>
            </div>
        </div>
    </section>

    <script src="../../static/js/main.js"></script>
    <script src="../../static/js/auth.js"></script>
</body>

</html>
